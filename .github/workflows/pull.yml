name: pull

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # mock-fs@5.3.0 breaks on Node 26.8.0+ due to private fs changes.
        node-version: [22, 24, '26.7.0']
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # TODO: remove once verified on CI; kept for release.yml
      - run: npm audit signatures
      - run: pnpm test
      - run: pnpm test:e2e
      - name: Upload e2e test artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-test-artifact
          path: |
            .test-artifacts/**/.serverless/*.json
            .test-artifacts/**/.serverless/*.zip
          retention-days: 7
      - run: pnpm build
